<script type="module">
import * as THREE from 'three';

/* ───────────────────────── utilities ───────────────────────── */
const V3 = THREE.Vector3, TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const damp = (k, dt) => 1 - Math.exp(-k * dt);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry32(20261015);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const UP = new V3(0, 1, 0);
const tmpV = new V3(), tmpV2 = new V3(), tmpQ = new THREE.Quaternion(), tmpM = new THREE.Matrix4();

/* deep-sea internal current surge rolling along +x */
const WIND_DIR = new V3(1, 0, .3).normalize();
const WIND_AXIS = new V3().crossVectors(UP, WIND_DIR).normalize();
const currentSurge = (x, z, t) => Math.pow(Math.max(0, Math.sin(t * .3 - x * .09 - z * .05)), 3);

/* ───────────────────────── renderer ───────────────────────── */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setClearColor(0x000000, 1);
const maxDpr = Math.min(window.devicePixelRatio || 1, 1.6);
let dpr = maxDpr;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.03, 500);
const U = {
  time: { value: 0 }, fadeStart: { value: 16 }, fade: { value: .05 },
  focus: { value: 15 }, focusRange: { value: 3 }, dofAmt: { value: 1 },
};

/* ───────────────────────── shaders ───────────────────────── */
const NOISE = `
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+17.1; a*=.5; } return s; }`;

// Focus as light: intensity is split into sharp / soft / very-soft channels by distance from the focus plane.
const DOF = `
uniform float uFocus, uFocusRange, uDofAmt, uFadeStart, uFade;
vec3 dofSplit(float I, float dist){
  float c = clamp(abs(dist - uFocus) / max(uFocusRange, 1e-3), 0., 3.) * uDofAmt;
  float w0 = 1. - smoothstep(.35, 1.1, c);
  float w2 = smoothstep(1.1, 2.4, c);
  float fade = exp(-max(0., dist-uFadeStart)*uFade) * smoothstep(.06,.5,dist);
  return I * fade * vec3(w0, max(0., 1.-w0-w2), w2);
}`;
const dofUniforms = () => ({ uFocus: U.focus, uFocusRange: U.focusRange, uDofAmt: U.dofAmt, uFadeStart: U.fadeStart, uFade: U.fade });
const ADD = { transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false };

const XRAY_VS = `
uniform float uTime, uWind;
varying vec3 vN, vV, vUv3, vLocal; varying float vDist;
#ifdef USE_PETAL
attribute vec3 aUV;
#endif
#ifdef USE_TENTACLE
attribute vec3 aUV;
#endif
void main(){
  vec3 p = position; vec3 n = normal; vUv3 = vec3(0.);
#ifdef USE_PETAL
  vUv3 = aUV;
  // medusa bell & oral-arm contraction + marginal wave
  float pulse = sin(uTime * 2.1 + aUV.z * 6.283);
  float flare = smoothstep(.15, 1., aUV.y);
  p.xz *= 1. - pulse * .16 * flare * uWind;
  p.y  += pulse * .09 * (1. - flare * .6) * uWind;
  p += n * (sin(uTime*2.4 + aUV.z*6.283 + aUV.y*4.5) + .5*sin(uTime*4.2 + aUV.x*6.)) * .028 * flare * uWind;
#endif
#ifdef USE_TENTACLE
  vUv3 = aUV;
  // sinusoidal traveling wave down trailing jellyfish tentacles & oral arms
  float down = aUV.y;
  float ph = uTime * 2.4 - down * 4.8 + aUV.z * 6.283;
  p.x += (sin(ph) * .28 + sin(ph * 2.1 + 1.3) * .09) * down * down * uWind;
  p.z += (cos(ph * .85 + aUV.x * 2.) * .24 + sin(ph * 1.7) * .08) * down * down * uWind;
#endif
  vLocal = p;
#ifdef USE_INSTANCING
  vec4 wp = modelMatrix * instanceMatrix * vec4(p,1.);
  vec3 wn = mat3(modelMatrix) * mat3(instanceMatrix) * n;
#else
  vec4 wp = modelMatrix * vec4(p,1.);
  vec3 wn = mat3(modelMatrix) * n;
#endif
  vN = normalize(wn);
  vec3 tc = cameraPosition - wp.xyz; vDist = length(tc); vV = tc / max(vDist,1e-4);
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;

const XRAY_FS = `
uniform float uBase,uFres,uPow,uVein,uVeinN,uEdge,uOpacity,uBands,uRim;
varying vec3 vN, vV, vUv3, vLocal; varying float vDist;
${NOISE}
${DOF}
void main(){
  vec3 N = normalize(vN), V = normalize(vV);
  float F = pow(1. - abs(dot(N,V)), uPow);
  float I = uBase + F*uFres;
#ifdef USE_PETAL
  float s=vUv3.x, v=vUv3.y, sd=vUv3.z;
  float w = vnoise(vec2(s*2.5+sd*13., v*3.5)) - .5;
  float ang = s*uVeinN + w*.45;
  float canal = pow(abs(cos(ang*3.14159)), 28.);
  float canal2 = pow(abs(cos((ang*2.+w)*3.14159)), 48.)*.45;
  float canals = (canal+canal2) * smoothstep(.05,.25,v) * (1.-.25*v);
  float coronal = exp(-pow((v-.68)*9., 2.)) * .55 + exp(-pow((v-.94)*16., 2.)) * .85;
  float edge = smoothstep(.85,1.,v)*.75;
  float tex = .75 + .5*vnoise(vec2(s*10.+sd*7., v*18.));
  I = uBase*tex + F*uFres + (canals + coronal*.45)*uVein + edge*uEdge*(.35+F);
#endif
#ifdef USE_TENTACLE
  float v = vUv3.y;
  float nematocyst = smoothstep(.55, 1., sin(v * 55. + vUv3.z * 20.));
  I = (uBase + F * uFres + nematocyst * uVein) * (1. - .55 * v * v);
#endif
#ifdef USE_BANDS
  float b = abs(fract(vLocal.z*uBands+.5)-.5)*2.;
  I += smoothstep(.72,1.,b)*.16 + F*.08;
#endif
#ifdef USE_RIM
  I += smoothstep(-.12, 0., vLocal.z) * uRim;
#endif
  gl_FragColor = vec4(dofSplit(I*uOpacity, vDist), 1.);
}`;

function xray(o = {}) {
  const defines = {};
  if (o.petal) defines.USE_PETAL = '';
  if (o.tentacle) defines.USE_TENTACLE = '';
  if (o.bands) defines.USE_BANDS = '';
  if (o.rim) defines.USE_RIM = '';
  return new THREE.ShaderMaterial({
    defines,
    uniforms: {
      uTime: U.time, ...dofUniforms(),
      uWind: { value: o.wind ?? 1 }, uBase: { value: o.base ?? .04 }, uFres: { value: o.fres ?? .7 },
      uPow: { value: o.pow ?? 2 }, uVein: { value: o.vein ?? .12 }, uVeinN: { value: o.veinN ?? 8 },
      uEdge: { value: o.edge ?? .28 }, uOpacity: { value: o.opacity ?? 1 }, uBands: { value: o.bands ?? 0 }, uRim: { value: o.rim ?? 0 },
    },
    vertexShader: XRAY_VS, fragmentShader: XRAY_FS, ...ADD, side: THREE.DoubleSide,
  });
}

function lineMat(op = 1) {
  return new THREE.ShaderMaterial({
    uniforms: { uOp: { value: op }, ...dofUniforms() },
    vertexShader: `attribute float aC; varying float vC; varying float vDist;
      void main(){ vC=aC; vec4 wp=modelMatrix*vec4(position,1.); vDist=distance(wp.xyz,cameraPosition); gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader: `uniform float uOp; varying float vC; varying float vDist; ${DOF}
      void main(){ gl_FragColor=vec4(dofSplit(vC*uOp, vDist),1.); }`,
    ...ADD,
  });
}
function lineGeo(pos, col) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aC', new THREE.Float32BufferAttribute(col, 1));
  return g;
}

function mergeGeos(geos) {
  const names = Object.keys(geos[0].attributes);
  let nv = 0, ni = 0;
  for (const g of geos) { nv += g.attributes.position.count; ni += g.index.count; }
  const out = new THREE.BufferGeometry(), arrs = {};
  for (const n of names) arrs[n] = new Float32Array(nv * geos[0].attributes[n].itemSize);
  const idx = new Uint32Array(ni);
  let ov = 0, oi = 0;
  for (const g of geos) {
    for (const n of names) arrs[n].set(g.attributes[n].array, ov * g.attributes[n].itemSize);
    const ia = g.index.array;
    for (let i = 0; i < ia.length; i++) idx[oi + i] = ia[i] + ov;
    ov += g.attributes.position.count; oi += ia.length; g.dispose();
  }
  for (const n of names) out.setAttribute(n, new THREE.BufferAttribute(arrs[n], geos[0].attributes[n].itemSize));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  out.computeBoundingSphere();
  return out;
}

function tube(points, r, seg = 20, rad = 6) {
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), seg, r, rad);
}

/* ───────────────────────── 1. DEEP-SEA MEDUSA (JELLYFISH) ─────────────────────────
 * Unmistakable hemispherical fluted umbrella bell, 4 spiral ruffled oral arms,
 * internal 4-leaf gastrovascular gonads, and 24 long flowing marginal tentacles!
 */
function medusaBellGeo(radius, height, lobes, seed, SU = 40, SV = 22) {
  const pos = [], uv = [], idx = [];
  for (let j = 0; j <= SV; j++) {
    const v = j / SV; // 0 = apex, 1 = bell rim margin
    const phi = v * Math.PI * .58;
    // coronal constriction groove around v = 0.68, flared scalloped lappets at v = 0.85..1.0
    const groove = 1 - .14 * Math.exp(-Math.pow((v - .66) * 7.5, 2));
    const rBase = radius * Math.sin(phi) * groove * (1 + .08 * Math.pow(v, 3));
    const yBase = height * (Math.cos(phi) - .22) - height * .08 * Math.pow(v, 4);
    for (let i = 0; i <= SU; i++) {
      const u = i / SU, th = u * TAU;
      const rib = 1 + (.055 * Math.sin( v * Math.PI) + .045 * Math.pow(v, 2)) * Math.cos(th * lobes);
      const scallop = Math.pow(v, 4) * .065 * Math.cos(th * lobes * 2);
      const r = rBase * rib;
      const x = Math.cos(th) * r;
      const z = Math.sin(th) * r;
      const y = yBase + scallop * height;
      pos.push(x, y, z);
      uv.push(u * 2 - 1, v, seed);
    }
  }
  for (let j = 0; j < SV; j++) for (let i = 0; i < SU; i++) {
    const a = j * (SU + 1) + i, b = a + 1, c = a + SU + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aUV', new THREE.Float32BufferAttribute(uv, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// Spiral ruffled ribbon oral arm hanging beneath the jellyfish bell
function oralArmGeo(len, wid, twist, seed, SU = 8, SV = 28) {
  const pos = [], uv = [], idx = [];
  for (let j = 0; j <= SV; j++) {
    const v = j / SV;
    const w = wid * Math.sin(Math.PI * Math.min(1, .08 + v * .88)) * (1 - .35 * v);
    const y = -v * len;
    const tw = v * twist + seed * TAU;
    const cx = Math.sin(v * 5 + seed * 6) * .16 * v;
    const cz = Math.cos(v * 4.3 + seed * 6) * .16 * v;
    for (let i = 0; i <= SU; i++) {
      const s = i / SU * 2 - 1;
      const ruff = Math.sin(v * 22 + s * 3 + seed * 10) * .06 * Math.abs(s) * w;
      const lx = s * w, lz = ruff;
      const x = cx + lx * Math.cos(tw) - lz * Math.sin(tw);
      const z = cz + lx * Math.sin(tw) + lz * Math.cos(tw);
      pos.push(x, y, z);
      uv.push(s, v, seed);
    }
  }
  for (let j = 0; j < SV; j++) for (let i = 0; i < SU; i++) {
    const a = j * (SU + 1) + i, b = a + 1, c = a + SU + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aUV', new THREE.Float32BufferAttribute(uv, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// Trailing marginal tentacle ribbon geometry
function tentacleRibbonGeo(len, wid, angle, rRim, seed, SV = 26) {
  const pos = [], uv = [], idx = [];
  const bx = Math.cos(angle) * rRim, bz = Math.sin(angle) * rRim;
  const tx = -Math.sin(angle), tz = Math.cos(angle);
  for (let j = 0; j <= SV; j++) {
    const v = j / SV;
    const w = wid * (1 - .75 * v);
    const flare = .12 * v * v;
    const cx = bx * (1 + flare), cz = bz * (1 + flare), cy = -v * len;
    for (let i = 0; i <= 1; i++) {
      const s = i * 2 - 1;
      pos.push(cx + tx * s * w, cy, cz + tz * s * w);
      uv.push(s, v, seed);
    }
  }
  for (let j = 0; j < SV; j++) {
    const a = j * 2, b = a + 1, c = a + 2, d = a + 3;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aUV', new THREE.Float32BufferAttribute(uv, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function buildMedusa(o) {
  const rnd = mulberry32(o.seed);
  const group = new THREE.Group();
  group.position.copy(o.pos);
  const axis = (o.axis || new V3(0, 1, 0)).clone().normalize();
  group.quaternion.setFromUnitVectors(UP, axis);
  group.scale.setScalar(o.scale);
  const baseQ = group.quaternion.clone();
  const op = o.opacity ?? 1;
  const seed0 = rnd();

  // Outer & inner umbrella bell
  const bellMat = xray({
    petal: true, base: o.live ? .014 : .009, fres: o.live ? .58 : .42,
    pow: 2.1, vein: o.live ? .18 : .12, veinN: 12, edge: .38, opacity: op
  });
  const bell = new THREE.Mesh(medusaBellGeo(1.35, 1.05, 12, seed0, o.live ? 48 : 32, o.live ? 26 : 18), bellMat);
  group.add(bell);

  // Inner subumbrella dome + 4 horseshoe gastrovascular gonad rings (classic X-ray jellyfish anatomy!)
  const gonadMat = xray({ base: o.live ? .045 : .02, fres: o.live ? .65 : .35, pow: 1.6, opacity: op });
  for (let k = 0; k < 4; k++) {
    const th = k / 4 * TAU + Math.PI / 4;
    const gRing = new THREE.Mesh(new THREE.TorusGeometry(.22, .048, 10, 22, Math.PI * 1.45), gonadMat);
    gRing.position.set(Math.cos(th) * .38, .28, Math.sin(th) * .38);
    gRing.rotation.set(Math.PI / 2 + .2, 0, th + Math.PI / 2);
    group.add(gRing);
  }
  // Central manubrium (stomach column)
  const manub = new THREE.Mesh(new THREE.CylinderGeometry(.18, .09, .75, 14, 1, true), xray({ base: .02, fres: .45, bands: 6, opacity: op }));
  manub.position.y = -.1;
  group.add(manub);

  // 4 long, ruffled spiral oral arms hanging down from the center
  const tentMat = xray({
    tentacle: true, base: o.live ? .018 : .01, fres: o.live ? .52 : .35,
    pow: 1.8, vein: .16, opacity: op
  });
  const armGeos = [];
  for (let k = 0; k < 4; k++) {
    const th = k / 4 * TAU;
    const ag = oralArmGeo(2.85 + rnd() * .4, .26, 7.5, (seed0 + k * .17) % 1, o.live ? 10 : 6, o.live ? 32 : 20);
    ag.applyMatrix4(tmpM.makeTranslation(Math.cos(th) * .16, -.12, Math.sin(th) * .16));
    armGeos.push(ag);
  }

  // 24 long flowing marginal tentacles + glowing rhopalia sensory bulbs around the bell rim
  const nTent = o.live ? 28 : 18;
  const anthers = [];
  const rhopGeo = new THREE.SphereGeometry(1, 10, 8);
  const rhopIM = new THREE.InstancedMesh(rhopGeo, gonadMat, nTent);
  rhopIM.frustumCulled = false;
  for (let k = 0; k < nTent; k++) {
    const th = k / nTent * TAU + (rnd() - .5) * .06;
    const len = 3.1 + Math.sin(k * 2.3) * .85 + rnd() * .6;
    armGeos.push(tentacleRibbonGeo(len, .026, th, 1.24, (seed0 + k * .07) % 1, o.live ? 28 : 18));
    const tip = new V3(Math.cos(th) * 1.26, -.12, Math.sin(th) * 1.26);
    rhopIM.setMatrixAt(k, tmpM.compose(tip, tmpQ.identity(), new V3(.032, .048, .032)));
    anthers.push(new V3(Math.cos(th) * (.55 + rnd() * .55), -.4 - rnd() * 1.4, Math.sin(th) * (.55 + rnd() * .55)));
  }
  group.add(new THREE.Mesh(mergeGeos(armGeos), tentMat), rhopIM);
  scene.add(group);

  const md = {
    group, bellMat, tentMat, baseQ, axis, scale: o.scale, kind: o.kind, ph: seed0 * TAU, anthers,
    center: new V3(), up: new V3(), visits: 0, name: o.name,
    dip: 0, dipV: 0, load: 0, dipAxis: new V3(1, 0, 0),
    kick(side, amt) { this.dipAxis.crossVectors(this.up, side).normalize(); this.dipV += amt * .5; },
    update(t, dt) {
      const pulse = Math.sin(t * 2.1 + this.ph);
      const acc = -22 * (this.dip - this.load * .1) - 3.2 * this.dipV;
      this.dipV += acc * dt; this.dip += this.dipV * dt;
      const g = currentSurge(o.pos.x, o.pos.z, t);
      bellMat.uniforms.uWind.value = .85 + g * .9;
      tentMat.uniforms.uWind.value = .85 + g * 1.3;
      // Medusa gently bobs up and down with each bell contraction!
      const bobY = Math.cos(t * 2.1 + this.ph - .6) * .28 * o.scale;
      const driftX = Math.sin(t * .42 + this.ph) * .22 * o.scale;
      group.position.set(o.pos.x + driftX, o.pos.y + bobY - this.dip * .3 * o.scale, o.pos.z);
      group.quaternion.copy(baseQ);
      group.rotateX(Math.sin(t * .38 + this.ph) * .08);
      group.rotateZ(Math.cos(t * .31 + this.ph) * .08);
      group.rotateOnWorldAxis(this.dipAxis, this.dip * .65);
      group.updateMatrixWorld();
      this.center.set(0, .15, 0); group.localToWorld(this.center);
      this.up.copy(UP).applyQuaternion(group.quaternion);
    },
  };
  md.update(0, 0);
  return md;
}

function makeRayFinTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const g = c.getContext('2d');
  g.lineJoin = 'round';
  g.beginPath(); g.moveTo(8, 128);
  g.bezierCurveTo(110, 32, 340, 24, 480, 74);
  g.bezierCurveTo(508, 108, 508, 148, 480, 182);
  g.bezierCurveTo(340, 232, 110, 224, 8, 128); g.closePath();
  g.fillStyle = 'rgba(255,255,255,.08)'; g.fill();
  g.strokeStyle = 'rgba(255,255,255,.88)'; g.lineWidth = 3.2; g.stroke();
  g.lineWidth = 2.0; g.strokeStyle = 'rgba(255,255,255,.72)';
  for (let i = 0; i < 15; i++) {
    const a = (i / 14 - .5) * 1.15;
    g.beginPath(); g.moveTo(10, 128);
    g.quadraticCurveTo(220, 128 + Math.sin(a) * 75, 478 - Math.abs(i - 7) * 8, 128 + Math.sin(a) * 165);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; t.colorSpace = THREE.NoColorSpace;
  return t;
}
const FIN_TEX = makeRayFinTexture();
function finMat(op) {
  return new THREE.ShaderMaterial({
    uniforms: { map: { value: FIN_TEX }, uOp: { value: op }, ...dofUniforms() },
    vertexShader: `varying vec2 vUv; varying float vDist; void main(){ vUv=uv; vec4 wp=modelMatrix*vec4(position,1.); vDist=distance(wp.xyz,cameraPosition); gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader: `uniform sampler2D map; uniform float uOp; varying vec2 vUv; varying float vDist; ${DOF}
      void main(){ vec4 t=texture2D(map,vUv); gl_FragColor=vec4(dofSplit(t.r*t.a*uOp, vDist),1.); }`,
    ...ADD, side: THREE.DoubleSide,
  });
}

function makeDeepCreature(seed, op = 1, species = 'angler') {
  const rnd = mulberry32(seed);

    const mProf = [];

    abdP.add(new THREE.Mesh(glad, mBone));

    // Paired ear-like dorsal mantle fins (Grimpoteuthis / Vampyroteuthis paddle fins)

    for (const sx of [-1, 1]) {
      const fGeo = mkFin(.78, .38, sx);
      const pf = new THREE.Group(); pf.position.set(sx * .22, .12, -.58); pf.add(new THREE.Mesh(fGeo, finMat(.85 * op))); abdP.add(pf);
      const ph = new THREE.Group(); ph.position.set(sx * .2, .1, -.66); ph.add(new THREE.Mesh(mkFin(.52, .26, sx), finMat(.35 * op))); abdP.add(ph);

    }

    // Head & large globular abyssal eyes
    const head = new THREE.Mesh(new THREE.SphereGeometry(.26, 24, 18), mFlesh);
    head.scale.set(1.12, .95, .95); head.position.set(0, 0, .18); body.add(head);
    for (const sx of [-1, 1]) {

    // 8 Long Radial Tentacular Arms + Cirri + Glowing Arm-Tip Photophores

        new V3(0, 0, 0),
        new V3(cx * .24, cy * .24, .32),

      ];
      g.add(new THREE.Mesh(tube(pts, .024, 20), mFlesh));
      const cCurve = new THREE.CatmullRomCurve3(pts);
      for (let ci = 1; ci <= 6; ci++) {
        const cp = cCurve.getPoint(ci / 7);
        const sucker = new THREE.Mesh(new THREE.SphereGeometry(.014, 6, 6), mBone);

      }
      const tipB = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), mLure);
      tipB.position.copy(pts[3]); tipB.scale.set(.032, .032, .045); g.add(tipB); baskets.push(tipB);

  } else {

    const bProf = [];
    for (let i = 0; i <= 32; i++) {
      const t = i / 32; // 0 = front snout, 1 = rear body joint
      const r = .44 * Math.sin(Math.PI * Math.pow(t, .68)) * (1 - .15 * t);

    }
    const bodyGeo = new THREE.LatheGeometry(bProf, 28); bodyGeo.rotateX(Math.PI / 2);

    stomach.scale.set(.78, .9, 1.25); stomach.position.set(0, -.08, .02); body.add(stomach);

    upJaw.add(new THREE.Mesh(new THREE.TorusGeometry(.27, .024, 8, 24, Math.PI), mBone));
    // Lower jaw arch (mandible, hinged wide open!)
    const loJaw = new THREE.Group(); loJaw.position.set(0, -.12, .34); loJaw.rotation.x = .52; body.add(loJaw);
    loJaw.add(new THREE.Mesh(new THREE.TorusGeometry(.30, .028, 8, 24, Math.PI), mBone));
    for (let i = -6; i <= 6; i++) {
      if (i === 0) continue;
      const a = (i / 6.5) * (Math.PI * .46);
      const lenL = (.085 + (1 - Math.abs(i) / 7) * .095) * (.85 + rnd() * .3);
      const fangL = new THREE.Mesh(new THREE.ConeGeometry(.011, lenL, 5), mFang);

      fangU.position.set(Math.cos(a) * .27, Math.sin(a) * .27, -lenU * .42);

    const mkPec = (w, h, sx) => { const g = new THREE.PlaneGeometry(1, 1); g.translate(.5, 0, 0); g.scale(w, h, 1); g.rotateX(Math.PI / 2); if (sx < 0) g.scale(-1, 1, 1); return g; };

    illiciumGroup.add(new THREE.Mesh(tube(rodPts, .015, 24), mBone));

    const escaCap = new THREE.Mesh(new THREE.SphereGeometry(.11, 18, 14), mFang);
    escaCap.position.copy(escaTip); escaCap.scale.set(1, 1.25, 1); illiciumGroup.add(escaCap);
    for (let k = 0; k < 10; k++) {
      const a = k / 10 * TAU;
      const tPts = [
        escaTip.clone(),
        escaTip.clone().add(new V3(Math.cos(a) * .08, -.06 + Math.sin(a) * .06, .06)),
        escaTip.clone().add(new V3(Math.cos(a) * .16, -.16 + Math.sin(a) * .09, .14)),

    }
    ants.push(illiciumGroup);
  }

  // Lateral line sensory neuromast cilia & dermal bioluminescence
  const pos = [], col = [];
  for (let i = 0; i < 420; i++) {
    const d = new V3(rnd() * 2 - 1, rnd() * 2 - 1, rnd() * 2 - 1).normalize();
    const b = new V3(d.x * .32, d.y * .34, d.z * .42);
    const l = .04 + rnd() * .07;
    pos.push(b.x, b.y, b.z, b.x + d.x * l, b.y + d.y * l, b.z + d.z * l);
    col.push(.12, .02);
  }
  const hm = lineMat(op); hairMats.push(hm);
  body.add(new THREE.LineSegments(lineGeo(pos, col), hm));

  return { root, body, abdP, legs, ants, wings, baskets, hairMats, escaAnchor, species, op, flap: rnd() * TAU, fold: 0, walk: 0, pitch: 0, load: .45, dust: 0 };
}

// Smooth aquatic swimming animation (S-wave tail propulsion, undulating pectoral fins, pulsing esca lure, billowing squid arms)
function animateCreature(b, dt, t, o) {
  b.fold = lerp(b.fold, o.fold ?? 0, damp(4, dt));
  // Slow, graceful deep-sea fin & tail frequency (~2.2 Hz instead of 31 Hz insect buzz!)
  const swimHz = (o.freq ?? 2.2);
  b.flap += dt * TAU * swimHz;

/* ───────────────────────── 3. CHAMBERED NAUTILUS (Logarithmic Spiral X-Ray Shell) ───────────────────────── */
function buildNautilus(pos, scale, seed) {
  const rnd = mulberry32(seed);
  const group = new THREE.Group(); group.position.copy(pos); group.scale.setScalar(scale);
  const lPos = [], lCol = [];
  const turns = 2.65, steps = 140;
  // Logarithmic spiral shell outline + 30 internal concave septa chamber walls + central siphuncle tube
  for (let s = 0; s <= steps; s++) {
    const u = s / steps, th = u * turns * TAU;
    const rOuter = .06 * Math.exp(.24 * th), rInner = .022 * Math.exp(.24 * th);
    // Cross-section ribs around the shell whorl
    if (s % 4 === 0 && s > 12) {
      const cx = Math.cos(th) * (rOuter + rInner) * .5, cy = Math.sin(th) * (rOuter + rInner) * .5;
      const rx = (rOuter - rInner) * .5, rz = rx * .72;
      for (let k = 0; k < 18; k++) {
        const a0 = k / 18 * TAU, a1 = (k + 1) / 18 * TAU;
        const p0x = cx + Math.cos(th) * Math.cos(a0) * rx, p0y = cy + Math.sin(th) * Math.cos(a0) * rx, p0z = Math.sin(a0) * rz;
        const p1x = cx + Math.cos(th) * Math.cos(a1) * rx, p1y = cy + Math.sin(th) * Math.cos(a1) * rx, p1z = Math.sin(a1) * rz;
        lPos.push(p0x, p0y, p0z, p1x, p1y, p1z); lCol.push(.28, .28);
      }
      // Internal concave septum wall dividing the spiral chambers
      for (let w = -2; w <= 2; w++) {
        const zOff = (w / 2.5) * rz * .8;
        const bow = th - .14;
        const mx = Math.cos(bow) * (rOuter * .52 + rInner * .48), my = Math.sin(bow) * (rOuter * .52 + rInner * .48);
        lPos.push(Math.cos(th) * rInner, Math.sin(th) * rInner, zOff * .3, mx, my, zOff, mx, my, zOff, Math.cos(th) * rOuter, Math.sin(th) * rOuter, zOff * .7);
        lCol.push(.42, .55, .55, .38);
      }
    }
    if (s > 0) {
      const th0 = (s - 1) / steps * turns * TAU;
      const ro0 = .06 * Math.exp(.24 * th0), rs0 = .038 * Math.exp(.24 * th0), rs1 = .038 * Math.exp(.24 * th);
      // Outer shell keel & internal siphuncle tube
      lPos.push(Math.cos(th0) * ro0, Math.sin(th0) * ro0, 0, Math.cos(th) * rOuter, Math.sin(th) * rOuter, 0); lCol.push(.5, .5);
      lPos.push(Math.cos(th0) * rs0, Math.sin(th0) * rs0, 0, Math.cos(th) * rs1, Math.sin(th) * rs1, 0); lCol.push(.32, .32);
    }
  }
  group.add(new THREE.LineSegments(lineGeo(lPos, lCol), lineMat(.95)));
  // Translucent outer shell envelope + cirrate tentacles emerging from aperture
  const shellBody = new THREE.Mesh(new THREE.TorusGeometry(.52, .32, 16, 36, Math.PI * 1.75), xray({ base: .012, fres: .38, bands: 8 }));
  shellBody.scale.set(1, 1, .68); group.add(shellBody);
  for (let k = 0; k < 12; k++) {
    const a = (k / 12 - .5) * .9;
    const tPts = [new V3(.65, .35 + a * .25, (rnd() - .5) * .2), new V3(.95, .42 + a * .35, (rnd() - .5) * .28), new V3(1.25, .32 + a * .4, (rnd() - .5) * .35)];
    group.add(new THREE.Mesh(tube(tPts, .014, 12), xray({ base: .03, fres: .48 })));
  }
  scene.add(group);
  return {
    group, basePos: pos.clone(), ph: rnd() * TAU,
    update(t) {
      group.position.set(pos.x + Math.sin(t * .35 + this.ph) * .45, pos.y + Math.cos(t * .52 + this.ph) * .32, pos.z);
      group.rotation.z = Math.sin(t * .4 + this.ph) * .08;
      group.rotation.y = .35 + Math.sin(t * .25 + this.ph) * .22;
    }
  };
}

  for (let i = 0; i < grainN; i++) {
    const g = grains[i];
    tmpV.copy(g.p).add(new V3(Math.sin(simT * g.sp + g.ph) * .03, Math.sin(simT * g.sp * .7 + g.ph * 2) * .04, Math.cos(simT * g.sp + g.ph) * .03));
    g.rot.x += sdt * g.sp; g.rot.y += sdt * g.sp * .6;
    grainIM.setMatrixAt(i, tmpM.compose(tmpV, tmpQ.setFromEuler(g.rot), new V3(g.s, g.s, g.s)));
  }
  grainIM.instanceMatrix.needsUpdate = true;
  const nearHive = camState.pos.distanceTo(H) < 75, nearSwarm = camState.pos.distanceTo(S) < 78;
  hive.visible = nearHive || !!trans;
  if (nearHive || trans) updateHive(sdt, simT);
  swarmGroup.visible = nearSwarm || !!trans;
  updateSwarm(sdt, simT, nearSwarm || !!trans);
  if (nearSwarm || trans) { swarmCentroid.set(0, 0, 0); for (let i = 0; i < SWN; i += 9) swarmCentroid.add(swarm.pos[i]); swarmCentroid.multiplyScalar(9 / SWN); swarmGroup.localToWorld(swarmCentroid); }

  // camera rig
  const shot = ch.shot(chT);
  orbit.idle += dt;
  if (!orbit.drag && orbit.idle > 4) { orbit.yaw *= 1 - damp(.6, dt); orbit.pitch *= 1 - damp(.6, dt); orbit.zoom = lerp(orbit.zoom, 1, damp(.4, dt)); }
  const aspectF = camera.aspect < 1 ? Math.pow(1 / camera.aspect, .75) : 1;
  const off = shot.pos.clone().sub(shot.tgt); sph.setFromVector3(off);
  sph.theta += orbit.yaw; sph.phi = clamp(sph.phi + orbit.pitch, .15, 2.95); sph.radius *= orbit.zoom * aspectF;
  const want = shot.tgt.clone().add(new V3().setFromSpherical(sph));
  let transK = 1;
  if (trans) {
    trans.t += dt;
    const k = easeIO(clamp(trans.t / trans.dur, 0, 1)); transK = k;
    const p0 = trans.from.pos, p3 = want;
    const p1 = p0.clone().add(new V3(0, trans.lift * .2, trans.lift * 1.4)), p2 = p3.clone().add(new V3(0, trans.lift * .2, trans.lift * 1.4));
    const u = 1 - k;
    camState.pos.set(0, 0, 0).addScaledVector(p0, u * u * u).addScaledVector(p1, 3 * u * u * k).addScaledVector(p2, 3 * u * k * k).addScaledVector(p3, k * k * k);
    camState.tgt.lerpVectors(trans.from.tgt, shot.tgt, easeIO(clamp(trans.t / trans.dur * 1.05, 0, 1)));
    const midBell = 4 * k * (1 - k) * clamp((p0.distanceTo(p3) - 10) / 24, 0, 1);
    if (midBell > 0) {
      camState.pos.lerp(new V3(0, 1.4, 13), midBell * .65);
      camState.tgt.lerp(new V3(0, -1.2, -5), midBell * .82);
    }
    camState.fov = lerp(trans.from.fov, ch.fov, k);
    if (trans.t >= trans.dur) trans = null;
  } else {
    camState.pos.lerp(want, damp(2.5, dt));
    camState.tgt.lerp(shot.tgt, damp(3, dt));
    camState.fov = lerp(camState.fov, ch.fov, damp(2, dt));
  }
  camera.position.copy(camState.pos);
  const hh = (reduced || orbit.drag) ? 0 : 1;
  camera.position.x += (Math.sin(wallT * .7) * .6 + Math.sin(wallT * 1.1 + 1) * .4) * .012 * hh;
  camera.position.y += (Math.sin(wallT * .53 + 2) * .6 + Math.sin(wallT * .9 + 4) * .4) * .01 * hh;
  camera.lookAt(camState.tgt);
  camera.rotateZ(Math.sin(wallT * .31) * .0009 * hh);
  if (Math.abs(camera.fov - camState.fov) > .01) { camera.fov = camState.fov; camera.updateProjectionMatrix(); pixU.value = Math.floor(Hh * dpr) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)); }
  camera.updateMatrixWorld();
  const dTgt = camera.position.distanceTo(camState.tgt);
  const wantFadeStart = trans ? Math.max(ch.fade[0], dTgt + 18) : ch.fade[0];
  const wantFade = trans ? Math.min(ch.fade[1], .02) : ch.fade[1];
  U.fadeStart.value = lerp(U.fadeStart.value, wantFadeStart, trans ? 1 : damp(2, dt));
  U.fade.value = lerp(U.fade.value, wantFade, trans ? 1 : damp(2, dt));
  const fTarget = trans ? dTgt : ch.focus();
  camState.focus = lerp(camState.focus, fTarget, trans ? 1 : damp(3.2, dt));
  U.focus.value = camState.focus;
  U.focusRange.value = lerp(U.focusRange.value, trans ? Math.max(ch.range * 2.4, 9.5) : ch.range, trans ? 1 : damp(3, dt));
  U.dofAmt.value = lerp(U.dofAmt.value, ch.dof * (trans ? .65 : 1), damp(3, dt));

  // post params
  const m = MODES[modeIdx], pu = post.uniforms;
  const effExp = trans ? lerp(.95, ch.exp, transK * transK) : ch.exp;
  if (modeT < 1) { modeT = Math.min(1, modeT + dt / 1.3); pu.uMix.value = easeIO(modeT); }
  pu.uGrain.value = lerp(pu.uGrain.value, m.grain, damp(3, dt));
  pu.uScan.value = lerp(pu.uScan.value, m.scan, damp(3, dt));
  pu.uAberr.value = lerp(pu.uAberr.value, m.aberr, damp(3, dt));
  pu.uHalf.value = lerp(pu.uHalf.value, m.half, damp(3, dt));
  pu.uExposure.value = lerp(pu.uExposure.value, m.exp * effExp, damp(3, dt));
  pu.uAscii.value = lerp(pu.uAscii.value, asciiOn ? 1 : 0, damp(4, dt));
  pu.uGlyphCap.value = lerp(pu.uGlyphCap.value, ch.glyph, damp(2, dt));
  pu.uCell.value = m.cell * dpr;
  pu.uPulse.value *= 1 - damp(2.2, dt);
  pu.uFadeIn.value = Math.min(1, pu.uFadeIn.value + dt / 2.5);
  toScreen(lightV.copy(ch.light()), tmpV);
  if (tmpV.z < 1) { pu.uLightPos.value.x = lerp(pu.uLightPos.value.x, tmpV.x / W, damp(2, dt)); pu.uLightPos.value.y = lerp(pu.uLightPos.value.y, 1 - tmpV.y / Hh, damp(2, dt)); }

  renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
  blurMat.uniforms.tIn.value = rtScene.texture; blurMat.uniforms.uDir.value.set(1.5 / rtA.width, 0); pass(blurMat, rtA);
  blurMat.uniforms.tIn.value = rtA.texture; blurMat.uniforms.uDir.value.set(0, 1.5 / rtA.height); pass(blurMat, rtB);
  blurMat.uniforms.tIn.value = rtB.texture; blurMat.uniforms.uDir.value.set(2 / rtC.width, 0); pass(blurMat, rtC);
  blurMat.uniforms.tIn.value = rtC.texture; blurMat.uniforms.uDir.value.set(0, 2 / rtC.height); pass(blurMat, rtD);
  pass(post, null);

  readTick -= dt;
  if (readTick <= 0) {
    readTick = .25;
    const d = new Date();
    date.textContent = `${MON[d.getMonth()]} ${d.getDate()}`;
    clock.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    readsEl.innerHTML = ch.reads().map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('') + `<div><span>frame</span><b>${String(frames).padStart(6, '0')}</b></div>`;
  }
  updateHud(dt);
}

/* ───────────────────────── boot ───────────────────────── */
let saved = 1; // Default to Cyanotype (bathymetric deep-sea blue) if no saved preference
try {
  const s = localStorage.getItem('abyssal-waggle-v2-mode');
  if (s !== null) saved = parseInt(s, 10) || 0;
} catch (e) { }
resize();
const fontsReady = document.fonts ? Promise.race([document.fonts.load('400 40px "Azeret Mono"'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.catch(() => { }).finally(() => {
  setMode(clamp(saved, 0, MODES.length - 1), true);
  goChapter(0, false, true);
  const s0 = CH[0].shot(0); camState.pos.copy(s0.pos); camState.tgt.copy(s0.tgt);
  resize();
  requestAnimationFrame(frame);
});
</script>
